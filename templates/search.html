{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Resultados para: {{ q }}</h2>
  <ul>
  {% for r in rows %}<li>#{{ r.id }} - {{ r.concept }} - ${{ r.amount }}</li>
  {% else %}<li>Sin resultados</li>{% endfor %}
  </ul>
  <a href="/dashboard">Volver</a>
</section>
{% endblock %}
