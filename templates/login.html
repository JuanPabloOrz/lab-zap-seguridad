{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Iniciar sesion</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Usuario <input name="username"></label>
    <label>Contrasena <input name="password" type="password"></label>
    <button>Entrar</button>
  </form>
  <p class="hint">Usuarios de prueba: juan / juan123 &middot; manuela / manuela123</p>
</section>
{% endblock %}
